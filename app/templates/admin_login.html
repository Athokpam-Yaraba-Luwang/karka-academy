<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in · Karka admin</title>
  <link rel="icon" href="{{ asset('img/icon-32.png') }}" sizes="32x32" type="image/png">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:16px;font:15px/1.5 system-ui,sans-serif;color:#1c0f24;
      background:radial-gradient(60% 50% at 20% 0%,#5a1a7a,transparent 70%),linear-gradient(160deg,#3a0d4c,#1a0522)}
    form{width:100%;max-width:360px;display:grid;gap:14px;padding:28px;border-radius:24px;color:#fff;background:#1f0a2b;border:1px solid rgba(255,255,255,.1);box-shadow:0 40px 80px -40px rgba(0,0,0,.8)}
    img{height:40px;width:auto;justify-self:start}
    h1{margin:4px 0 0;font-size:20px}
    p{margin:0;color:#cdb4ff;font-size:14px}
    label{display:grid;gap:6px;font-weight:600;font-size:13.5px;color:#e9dcff}
    input{width:100%;min-height:48px;padding:12px 14px;border-radius:14px;border:1.5px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;font-size:16px;outline:none}
    input:focus{border-color:#9b4dff;background:rgba(255,255,255,.1);box-shadow:0 0 0 4px rgba(155,77,255,.25)}
    button{min-height:48px;border:0;border-radius:999px;color:#fff;font-weight:700;font-size:15px;cursor:pointer;
      background:linear-gradient(100deg,#7b2fe0,#c13cf0 50%,#ff4fb8)}
    .err{padding:10px 12px;border-radius:12px;background:rgba(244,63,94,.15);color:#fda4af;font-size:14px}
  </style>
</head>
<body>
  <form method="post" action="/admin/login">
    <img src="{{ asset('img/karka-logo-light.webp') }}" width="427" height="96" alt="Karka AI &amp; Tech Academy">
    <div><h1>Lead inbox</h1><p>Sign in to see career-call enquiries.</p></div>
    {% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
    <label>Admin password <input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
